<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malam Sekolah Media — BEM FTUI 2026</title>
<meta name="color-scheme" content="light">

<meta property="og:type" content="website">
<meta property="og:title" content="Malam Sekolah Media — BEM FTUI 2026">
<meta property="og:description" content="You are invited.">
<meta property="og:url" content="https://www.bemftui2026.com">

<link rel="stylesheet" href="assets/css/style.css">
<noscript><style>body[data-stage="invite"] .rest { display: block; }</style></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' font-family='Helvetica'>&lt;/&gt;</text></svg>">
</head>

<body data-stage="invite">

<header class="topbar">
  <div class="topbar__in">
    <span class="topbar__mark" data-text="mark">&lt;/&gt;</span>
    <a class="topbar__brand" href="https://www.bemftui2026.com" data-text="brand">www.bemftui2026.com</a>
    <span id="logos-head" class="logos-slot"></span>
  </div>
</header>

<main>

  <section class="screen" id="undanganku">
    <div class="wrap">
      <article class="card" id="hero-card"></article>
    </div>
  </section>

  <div class="load" id="load" aria-hidden="true">
    <span class="load__mark" data-text="loading">&lt;/&gt;</span>
    <span class="load__bar"><span class="load__fill"></span></span>
  </div>

  <section class="section rest" id="agenda">
    <div class="wrap">
      <ol class="tasks" id="agenda-list"></ol>
      <div class="cue" id="cue" aria-hidden="true">
        <svg viewBox="0 0 24 14" width="26" height="15">
          <path d="M2 2l10 10L22 2" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </section>

  <section class="section section--alt rest" id="voting">
    <div class="wrap">
      <h2 class="label" data-rise data-text="votingLabel">voting tanggal</h2>

      <div class="vote">

        <div class="panel" data-rise style="--d:0.08s">
          <div class="who" id="vote-who">
            <span>&gt; <strong id="vote-name"></strong></span>
            <span class="comment" id="vote-mine"></span>
          </div>

          <div class="roster" id="roster"></div>

          <ol class="top3" id="top3"></ol>

          <div class="stats">
            <div class="stat">
              <div class="stat__k" data-text="vote.orang">ORANG</div>
              <div class="stat__v" id="stat-people">0/20</div>
            </div>
            <div class="stat">
              <div class="stat__k" data-text="vote.tag">TAG</div>
              <div class="stat__v" id="stat-tags">0</div>
            </div>
            <div class="stat">
              <div class="stat__k" data-text="vote.top">TOP</div>
              <div class="stat__v" id="stat-top">&mdash;</div>
            </div>
          </div>

          <div class="tools">
            <button class="btn btn--ghost" type="button" id="tool-reset" data-text="btn.hapus">hapus</button>
          </div>

          <button class="btn submit" type="button" id="submit" data-text="btn.submit" disabled>submit</button>

          <p class="panel__foot" id="vote-msg" role="status" aria-live="polite"></p>
        </div>

        <div class="panel" data-rise style="--d:0.16s">
          <div class="cal__head">
            <span class="cal__month" id="cal-month">September 2026</span>
            <span class="cal__hint" id="vote-mode"></span>
          </div>

          <div class="cal__grid" id="cal-grid"></div>

          <div class="legend">
            <span class="legend__sw" style="background:var(--heat-0)"></span>
            <span class="legend__sw" style="background:var(--heat-1)"></span>
            <span class="legend__sw" style="background:var(--heat-2)"></span>
            <span class="legend__sw" style="background:var(--heat-3)"></span>
            <span class="legend__sw" style="background:var(--heat-4)"></span>
            <span class="legend__sw" style="background:var(--heat-5)"></span>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<section class="thanks" id="thanks" aria-label="Terima kasih">
  <p class="thanks__see" data-rise data-text="seeYou">see you</p>

  <div class="thanks__stats" data-rise style="--d:0.14s">
    <div class="thanks__mine" id="thanks-mine"></div>
    <ol class="top3 top3--thanks" id="thanks-top3"></ol>
  </div>

  <div class="thanks__logos" id="logos-thanks" data-rise style="--d:0.30s"></div>

  <div class="thanks__sign" data-rise style="--d:0.36s" data-text="mark">&lt;/&gt;</div>

  <div class="thanks__actions" data-rise style="--d:0.52s">
    <button class="btn btn--ghost" type="button" id="thanks-back" data-text="btn.back">back</button>
    <button class="btn" type="button" id="thanks-edit" data-text="btn.edit">edit tanggal</button>
  </div>
</section>

<footer class="foot rest">
  <div class="wrap">
    <a class="foot__site" id="foot-site" href="https://www.bemftui2026.com">www.bemftui2026.com</a>
    <span id="logos-foot" class="logos-slot"></span>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/calendar.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
