<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malam Sekolah Media — BEM FTUI 2026</title>
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="Malam Sekolah Media — BEM FTUI 2026">
<meta property="og:description" content="You are invited.">
<meta property="og:url" content="https://www.bemftui2026.com">

<link rel="stylesheet" href="assets/css/style.css">
<noscript><style>body[data-stage="invite"] .rest { display: block; }</style></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' font-family='Helvetica'>&lt;/&gt;</text></svg>">
</head>

<body data-stage="invite">

<header class="topbar">
  <div class="topbar__in">
    <div class="topbar__brand"><span data-text="brand">BEM FTUI</span> <span data-text="brandYear">2026</span></div>
    <button type="button" class="themebtn" id="theme">dark</button>
  </div>
</header>

<main>

  <section class="screen" id="undanganku">
    <div class="wrap">
      <article class="card" id="hero-card"></article>
      <button type="button" class="gate" id="gate" data-text="gate">&lt;/&gt;</button>
    </div>
  </section>

  <div class="load" id="load" aria-hidden="true">
    <span class="load__mark" data-text="loading">&lt;/&gt;</span>
    <span class="load__bar"><span class="load__fill"></span></span>
  </div>

  <section class="section rest" id="agenda">
    <div class="wrap">
      <ol class="tasks" id="agenda-list"></ol>
    </div>
  </section>

  <section class="section section--alt rest" id="voting">
    <div class="wrap">
      <h2 class="label" data-text="votingLabel">voting tanggal</h2>

      <div class="vote">

        <div class="panel">
          <form id="vote-form">
            <label class="field">
              <span class="field__label" data-text="vote.username">USERNAME</span>
              <input class="input" id="vote-input" type="text" autocomplete="off"
                     placeholder="kean" data-placeholder="vote.placeholder"
                     maxlength="20" spellcheck="false">
            </label>
            <button class="btn" type="submit" data-text="btn.masuk">masuk</button>
            <div class="chips" id="vote-chips"></div>
          </form>

          <div class="who" id="vote-who" hidden>
            <span>&gt; <strong id="vote-name"></strong></span>
            <span class="comment" id="vote-mine"></span>
            <button type="button" id="vote-swap" data-text="btn.ganti">ganti</button>
          </div>

          <ul class="rank" id="rank"></ul>

          <div class="stats">
            <div class="stat">
              <div class="stat__k" data-text="vote.orang">ORANG</div>
              <div class="stat__v" id="stat-people">0/20</div>
            </div>
            <div class="stat">
              <div class="stat__k" data-text="vote.tag">TAG</div>
              <div class="stat__v" id="stat-tags">0</div>
            </div>
            <div class="stat">
              <div class="stat__k" data-text="vote.top">TOP</div>
              <div class="stat__v" id="stat-top">&mdash;</div>
            </div>
          </div>

          <div class="tools">
            <button class="btn btn--ghost" type="button" id="tool-refresh" data-text="btn.refresh">refresh</button>
            <button class="btn btn--ghost" type="button" id="tool-copy" data-text="btn.salin">salin</button>
            <button class="btn btn--ghost" type="button" id="tool-reset" data-text="btn.hapus">hapus</button>
          </div>

          <p class="panel__foot" id="vote-msg" role="status" aria-live="polite"></p>
        </div>

        <div class="panel">
          <div class="cal__head">
            <span class="cal__month" id="cal-month">September 2026</span>
            <span class="cal__hint" id="vote-mode"></span>
          </div>

          <div class="cal__grid" id="cal-grid"></div>

          <div class="legend">
            <span class="legend__sw" style="background:var(--heat-0)"></span>
            <span class="legend__sw" style="background:var(--heat-1)"></span>
            <span class="legend__sw" style="background:var(--heat-2)"></span>
            <span class="legend__sw" style="background:var(--heat-3)"></span>
            <span class="legend__sw" style="background:var(--heat-4)"></span>
            <span class="legend__sw" style="background:var(--heat-5)"></span>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<footer class="foot rest">
  <div class="wrap">
    <a class="foot__site" id="foot-site" href="https://www.bemftui2026.com">www.bemftui2026.com</a>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/calendar.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
